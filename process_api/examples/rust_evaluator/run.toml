# Rust process evaluator with nested/ragged Breit-Wigner domains.
# Requires: Apptainer and `just process-rust-evaluator-sif`.
# Scale: a small protocol example; normally seconds after image construction.
# Run: ./gammaboard run create process_api/examples/rust_evaluator/run.toml

name = "rust-evaluator"

[evaluator]
kind = "process_evaluator"
command = ["apptainer", "exec", "$resources/../process_api/examples/rust_evaluator/runtime.sif", "rust-evaluator-worker"]
cwd = "$resources"
args = { scale = 1.0 }
domain = { discrete = { axis_label = "d0", branches = [
  { index = 0, domain = { rectangular = { discrete_cardinalities = [], continuous_dims = 3 } } },
  { index = 1, domain = { discrete = { axis_label = "d1", branches = [
    { index = 0, domain = { rectangular = { discrete_cardinalities = [], continuous_dims = 1 } } },
    { index = 1, domain = { rectangular = { discrete_cardinalities = [5], continuous_dims = 5 } } },
  ] } } },
] } }
output = {kind = "values", components = ["value"]}

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["value"]
training_projection = { kind = "component", name = "value" }

[task_queue.accumulator.discrete_projections]
streams = ["value"]

[[task_queue.accumulator.discrete_projections.items]]
name = "top_level"
dims = [0]
fixed_dims = {}

[[task_queue.accumulator.discrete_projections.items]]
name = "d0_1_subspace"
dims = [1, 2]
fixed_dims = { "0" = 1 }

[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 100000 }
sampler = { config = { kind = "naive_monte_carlo", seed = 0 } }
