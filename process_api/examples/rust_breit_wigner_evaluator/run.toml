name = "rust-breit-wigner-evaluator-demo"

[evaluator]
kind = "process_evaluator"
command = ["apptainer", "exec", "$resources/../process_api/examples/rust_breit_wigner_evaluator/runtime.sif", "breit-wigner-worker"]
cwd = "$resources"
args = { scale = 1.0 }
domain = { discrete = { axis_label = "d0", branches = [
  { index = 0, domain = { continuous = { dims = 3 } } },
  { index = 1, domain = { discrete = { axis_label = "d1", branches = [
    { index = 0, domain = { continuous = { dims = 1 } } },
    { index = 1, domain = { rectangular = { discrete_cardinalities = [5], continuous_dims = 5 } } },
  ] } } },
] } }

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["value"]
training_projection = { kind = "component", name = "value" }

[task_queue.accumulator.discrete_projections]
streams = ["value"]

[[task_queue.accumulator.discrete_projections.items]]
name = "top_level"
dims = [0]
fixed_dims = {}

[[task_queue.accumulator.discrete_projections.items]]
name = "d0_1_subspace"
dims = [1, 2]
fixed_dims = { "0" = 1 }

[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 100000 }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 32, samples_for_update = 4096, initial_training_rate = 0.1, final_training_rate = 0.01 } }
