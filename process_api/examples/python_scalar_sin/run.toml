name = "python-scalar-sin-demo"

[evaluator]
kind = "process_evaluator"
command = ["$resources/../process_api/examples/python_scalar_sin/.venv/bin/python", "-u", "-m", "run_evaluator"]
cwd = "$resources/../process_api/examples/python_scalar_sin/src"
domain = { rectangular = { discrete_cardinalities = [2, 3], continuous_dims = 2 } }
args = { scale = 1.0, bias = 0.0, freq_u = 2.0, freq_v = 1.25 }

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["value"]
training_projection = { kind = "component", name = "value" }

[[task_queue.accumulator.discrete_projections.items]]
name = "spin"
dims = [0]
fixed_dims = {}

[[task_queue.accumulator.discrete_projections.items]]
name = "channel_for_spin_0"
dims = [1]
fixed_dims = { "0" = 0 }

[[task_queue.accumulator.discrete_projections.items]]
name = "channel_for_spin_1"
dims = [1]
fixed_dims = { "0" = 1 }

[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 100000 }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 16, samples_for_update = 4096, initial_training_rate = 0.1, final_training_rate = 0.01 } }
