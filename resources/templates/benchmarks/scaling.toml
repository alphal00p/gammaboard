# A bounded CPU-only sweep. All children share a small physical-core affinity set.
eval_us = [1, 10, 100, 1000]
workers = [1, 2, 4, 8]
batch_sizes = [256]
repetitions = 3
duration_seconds = 5
warmup_seconds = 2
budget_seconds = 1800
cpu_limit = 8
seed = 1234

# Explicit tuning; use 10ms to measure the normal runner tick floor.
min_tick_time_ms = 0
telemetry_interval_ms = 250
