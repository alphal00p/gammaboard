# Real-valued Monte Carlo sampling.
# Requires: an existing scalar-compatible run.
# Scale: 1000 samples; normally a few seconds.
# Run: ./gammaboard run task append <RUN> resources/templates/tasks/sample_monte_carlo_real.toml

replacements = { samples = 1_000 }

[[task_queue]]
kind = "sample"
stop_condition = { max_samples = "$(samples:1_000)" }
sampler_aggregator = { config = { kind = "naive_monte_carlo" } }
