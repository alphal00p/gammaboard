# A 2D grid of curve sharpness and periodic phase shift; all three exact integral means stay zero.
kind = "parameter_scan"
name = "tetrahedron-scan"
max_concurrent_runs = 2
measurement = { source_task = "inference", selection = { kind = "metric", name = "error", component = "x" } }
[[parameters]]
name = "sharpness"
values = [4,8,12]
[[parameters]]
name = "phase"
values = [0.0,0.125,0.25]
[child]
run = { file = "support/tetrahedron-trial.toml" }
