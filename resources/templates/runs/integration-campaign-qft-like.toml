# Diagram-decomposed ttH@LO integration campaign. GammaLoop's generated ttH
# state contains two graph groups (GL0 and GL2) with a shared observable
# definition. Each child samples one group with its own Havana grid; the parent
# continuously adds their complex estimates and every compatible histogram bin.
#
# Requires a ttH state generated by the GammaLoop revision used to build
# GammaBoard. Override `state_folder` when it lives outside `resources/`.
# Run: ./gammaboard run create resources/templates/runs/integration-campaign-qft-like.toml

replacements = { run_name = "integration-campaign-tth-diagrams", state_folder = "states/epem_a_ttxh/LO/state", max_total_samples = 10_000_000, min_samples_per_child = 10_000, allocation_window_samples = 10_000, samples_for_update = 2_000, max_batch_size = 2_000 }

name = '$(run_name:"integration-campaign-tth-diagrams")'

[[task_queue]]
name = "campaign"
kind = "integration_campaign"
measurement = { source_task = "integrate" }
stop_condition = { min_total_samples = "$(max_total_samples:10_000_000)", max_total_samples = "$(max_total_samples:10_000_000)" }
allocation = { algorithm = "variance_reduction_rate", max_active_runs = 1, allocation_window_samples = "$(allocation_window_samples:10_000)", min_samples_per_child = "$(min_samples_per_child:10_000)" }

# First generated ttH graph group (GL0).
[[task_queue.children]]
name = "GL0"
coefficient = 1.0
run_toml = '''
name = "campaign-tth-GL0"

[evaluator]
kind = "gammaloop"
state_folder = "$(state_folder:states/epem_a_ttxh/LO/state)"
integrand_name = "LO"
graph_groups = [0]

[evaluator.preprocessing]
read_only = true
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[task_queue]]
name = "integrate"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = $(max_total_samples:10_000_000) }
accumulator = "latest"
sampler_aggregator = { config = { kind = "havana_training", seed = 11, bins = 64, samples_for_update = $(samples_for_update:2_000), initial_training_rate = 0.05, final_training_rate = 0.005 } }
queue_tuning = { target_batch_eval_ms = 1000.0, max_batch_size = $(max_batch_size:2_000) }
'''

# Second generated ttH graph group (GL2). Its local domain contains only this
# group, while GammaLoop still records the same full histogram schema.
[[task_queue.children]]
name = "GL2"
coefficient = 1.0
run_toml = '''
name = "campaign-tth-GL2"

[evaluator]
kind = "gammaloop"
state_folder = "$(state_folder:states/epem_a_ttxh/LO/state)"
integrand_name = "LO"
graph_groups = [1]

[evaluator.preprocessing]
read_only = true
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[task_queue]]
name = "integrate"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = $(max_total_samples:10_000_000) }
accumulator = "latest"
sampler_aggregator = { config = { kind = "havana_training", seed = 29, bins = 64, samples_for_update = $(samples_for_update:2_000), initial_training_rate = 0.05, final_training_rate = 0.005 } }
queue_tuning = { target_batch_eval_ms = 1000.0, max_batch_size = $(max_batch_size:2_000) }
'''
