kind = "integration_campaign"
name = "ttH-campaign"

[replacements]
state_folder = "states/epem_a_ttxh/LO/state"

[stop_condition]
max_total_samples = 10000000

[allocation]
min_samples_per_child = 10000
allocation_window_samples = 10000

[[children]]
name = "GL0"

[children.replacements]
graph_group = 0
seed = 11
state_folder = "$(state_folder:states/epem_a_ttxh/LO/state)"

[children.run]
file = "tt_h.toml"

[[children]]
name = "GL2-trained"
coefficient = 0.5

[children.replacements]
graph_group = 1
seed = 29
state_folder = "$(state_folder:states/epem_a_ttxh/LO/state)"

[children.run]
file = "tt_h.toml"

[[children]]
name = "GL2-naive"
coefficient = 0.5
run = "name = \"ttH-GL2-naive\"\n\n[evaluator]\nkind = \"gammaloop\"\nstate_folder = \"$(state_folder:states/epem_a_ttxh/LO/state)\"\nintegrand_name = \"LO\"\ngraph_groups = [\"$(graph_group:1)\"]\n\n[evaluator.preprocessing]\nread_only = true\ncommands = [\"set model MT=173.0\", \"set model WT=0.0\", \"set model ymt=173.0\", \"set model aS=0.118\", \"set model aEWM1=132.507\", \"set model Gf=1.166390e-05\", \"set model MZ=91.188\"]\n\n[[task_queue]]\nname = \"integrate\"\nkind = \"sample\"\n\n[task_queue.stop_condition]\nmax_samples = 10000000\n\n[task_queue.accumulator]\nconfig = \"gammaloop\"\n\n[task_queue.sampler.config]\nkind = \"naive_monte_carlo\"\nseed = \"$(seed:41)\"\n"

[children.replacements]
graph_group = 1
seed = 41
state_folder = "$(state_folder:states/epem_a_ttxh/LO/state)"
