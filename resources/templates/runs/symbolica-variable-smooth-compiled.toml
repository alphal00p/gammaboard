kind = "parameter_scan"
name = "$(run_name:\"symbolica_variable_theta_mass_scan\")"
max_concurrent_runs = "$(max_concurrent_runs:2)"

[replacements]
run_name = "symbolica_variable_theta_mass_scan"
samples = 100000
max_concurrent_runs = 2

[measurement]
source_task = "sample"

[[parameters]]
name = "mass"

[parameters.linspace]
start = 0.2
stop = 2.0
count = 21

[child]
run = "name = \"variable-theta-mass-$(mass:1.0)\"\n\n[target]\nkind = \"vector\"\n\n[target.components]\nreal = 0.0\nimag = 0.0\n\n[evaluator]\nkind = \"symbolica\"\nargs = [\"k0\", \"k1\", \"k2\"]\n\n[evaluator.source]\nkind = \"compiled\"\npath = \"artifacts/variable_theta.so\"\nname = \"variable_theta\"\noutputs = 1\ncompiled_args = [\"pi\", \"a\", \"b\", \"c\", \"subtraction_width\", \"max_imag_root_part\", \"max_eta_min\", \"mask_width\", \"m0\", \"m1\", \"m2\", \"q0_0\", \"q0_1\", \"q0_2\", \"q0_3\", \"q1_0\", \"q1_1\", \"q1_2\", \"q1_3\", \"q2_0\", \"q2_1\", \"q2_2\", \"q2_3\", \"k0\", \"k1\", \"k2\"]\n\n[evaluator.source.bindings]\npi = \"pi\"\na = 1.0\nb = 1.0\nc = 1.0\nsubtraction_width = 0.5\nmax_imag_root_part = 1000000000000000.0\nmax_eta_min = 10000000000.0\nmask_width = 0.5\nm0 = \"$(mass:1.0)\"\nm1 = \"$(mass:1.0)\"\nm2 = \"$(mass:1.0)\"\nq0_0 = -1.76776695\nq0_1 = 0.0\nq0_2 = 0.0\nq0_3 = 0.35355339\nq1_0 = 0.0\nq1_1 = 0.0\nq1_2 = 0.0\nq1_3 = 0.0\nq2_0 = 1.06066017\nq2_1 = 0.0\nq2_2 = 0.0\nq2_3 = 0.35355339\n\n[[task_queue]]\nname = \"sample\"\nkind = \"sample\"\n\n[task_queue.measurement.selection]\nkind = \"all_component_means\"\n\n[task_queue.stop_condition]\nmax_samples = \"$(samples:100000)\"\n\n[task_queue.accumulator.config]\nkind = \"vector\"\ncomponents = [\"real\", \"imag\"]\n\n[task_queue.accumulator.config.training_projection]\nkind = \"component\"\nname = \"real\"\n\n[task_queue.sampler.config]\nkind = \"naive_monte_carlo\"\nseed = 0\n\n[[task_queue.sampler.config.transforms]]\nkind = \"spherical\"\n"

[child.replacements]
samples = "$(samples:100000)"
