# Parameter scan; integration settings belong to the child.
kind = "parameter_scan"
name = "$(run_name:\"symbolica_variable_theta_mass_scan\")"
max_concurrent_runs = "$(max_concurrent_runs:2)"
replacements = { run_name = "symbolica_variable_theta_mass_scan", samples = 100000, max_concurrent_runs = 2 }
measurement = { source_task = "sample" }

[[parameters]]
name = "mass"
linspace = { start = 0.2, stop = 2.0, count = 21 }

[child]
replacements = { samples = "$(samples:100000)" }

[child.run]
name = "variable-theta-mass-$(mass:1.0)"
target = { kind = "vector", components = { real = 0.0, imag = 0.0 } }

[child.run.evaluator]
kind = "symbolica"
args = ["k0", "k1", "k2"]
compiled_args = ["pi", "a", "b", "c", "subtraction_width", "max_imag_root_part", "max_eta_min", "mask_width", "m0", "m1", "m2", "q0_0", "q0_1", "q0_2", "q0_3", "q1_0", "q1_1", "q1_2", "q1_3", "q2_0", "q2_1", "q2_2", "q2_3", "k0", "k1", "k2"]
source = { kind = "compiled", path = "artifacts/variable_theta.so", name = "variable_theta", outputs = 1 }

[child.run.evaluator.bindings]
pi = "pi"
a = 1.0
b = 1.0
c = 1.0
subtraction_width = 0.5
max_imag_root_part = 1000000000000000.0
max_eta_min = 10000000000.0
mask_width = 0.5
m0 = "$(mass:1.0)"
m1 = "$(mass:1.0)"
m2 = "$(mass:1.0)"
q0_0 = -1.76776695
q0_1 = 0.0
q0_2 = 0.0
q0_3 = 0.35355339
q1_0 = 0.0
q1_1 = 0.0
q1_2 = 0.0
q1_3 = 0.0
q2_0 = 1.06066017
q2_1 = 0.0
q2_2 = 0.0
q2_3 = 0.35355339

[[child.run.task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(samples:100000)" }
accumulator = { config = { kind = "vector", components = ["real", "imag"], training_projection = { kind = "component", name = "real" } } }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 0 } }

[[child.run.task_queue.batch_transforms]]
kind = "spherical"
