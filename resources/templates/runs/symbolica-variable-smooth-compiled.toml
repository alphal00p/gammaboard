# Symbolica precompiled evaluator demo.
#
# This expects a Symbolica shared library exported with function name
# `variable_theta`, for example from:
#
#   WrappedEvaluator(ib.combined_result(), ib.get_args(), "variable_theta")
#
# Put the resulting artifact in one of GammaBoard's resource roots as:
#
#   resources/artifacts/variable_theta.so
#
# The compiled evaluator input order is:
#
#   [pi, a, b, c, subtraction_radius, max_imag_root, max_eta_min, mask_width,
#    m0, m1, m2, q0[0..4], q1[0..4], q2[0..4], k[0..3]]
#
# Only k is sampled by GammaBoard here. The control parameters, masses, and
# momentum offsets are fixed inputs supplied through `bindings`.

replacements = { run_name = "symbolica_variable_smooth_compiled", samples = 100000 }

name = '$(run_name:"symbolica_variable_smooth_compiled")'
target = { kind = "vector", components = { real = 0.0, imag = 0.0 } }

[evaluator]
kind = "symbolica"

# These are the sampled coordinates and therefore define the GammaBoard domain.
args = ["k0", "k1", "k2"]

# These are the flat argument names expected by the compiled Symbolica function.
# If your Python wrapper exports slightly different vector component names,
# adjust this list to match `ib.get_args()`.
compiled_args = [
  "pi",
  "a", "b", "c",
  "subtraction_radius", "max_imag_root", "max_eta_min", "mask_width",
  "m0", "m1", "m2",
  "q0_0", "q0_1", "q0_2", "q0_3",
  "q1_0", "q1_1", "q1_2", "q1_3",
  "q2_0", "q2_1", "q2_2", "q2_3",
  "k0", "k1", "k2",
]

[evaluator.source]
kind = "compiled"
path = "artifacts/variable_theta.so"
name = "variable_theta"
outputs = 1

# Fixed compiled inputs. Values are exact Symbolica-compatible numeric strings;
# TOML floats are intentionally rejected. `pi`, `i`, and `I` are accepted for
# compiled input bindings.
[evaluator.bindings]
pi = "pi"
a = "1"
b = "1"
c = "1"
subtraction_radius = "1/10"
max_imag_root = "0"
max_eta_min = "0"
mask_width = "1/20"
m0 = "1"
m1 = "1"
m2 = "1"
q0_0 = "0"
q0_1 = "0"
q0_2 = "0"
q0_3 = "0"
q1_0 = "0"
q1_1 = "0"
q1_2 = "0"
q1_3 = "0"
q2_0 = "0"
q2_1 = "0"
q2_2 = "0"
q2_3 = "0"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(samples:100000)" }

[task_queue.accumulator.config]
kind = "vector"
components = ["real", "imag"]
training_projection = { kind = "component", name = "real" }

[task_queue.sampler_aggregator.config]
kind = "naive_monte_carlo"
seed = 0
