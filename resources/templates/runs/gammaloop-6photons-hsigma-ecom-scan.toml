# Parameter scan; integration settings belong to the child.
kind = "parameter_scan"
name = "$(run_name:\"gammaloop_6photons_hsigma_ecom_scan\")"
max_concurrent_runs = "$(max_concurrent_runs:1)"
measurement = { source_task = "sample" }

[replacements]
run_name = "gammaloop_6photons_hsigma_ecom_scan"
state_folder = "../gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state"
havana_total_nr_of_samples = 50000
havana_bins = 64
havana_samples_for_update = 10000
trial_min_samples = 10000
trial_max_samples = 100000
trial_rsd_relative_error = 0.1
max_batch_size = 10000
max_concurrent_runs = 1

[[parameters]]
name = "h_sigma"
values = [0.25, 0.5, 1.0, 2.0, 4.0]

[[parameters]]
name = "e_com"
values = [500.0, 750.0, 1000.0, 1250.0, 1500.0]

[child]

[child.run]
name = "6photons-hsigma-$(h_sigma:1.0)-ecom-$(e_com:1000.0)"

[child.run.evaluator]
kind = "gammaloop"
state_folder = "$(state_folder:\"../gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state\")"
integrand_name = "default"

[child.run.evaluator.preprocessing]
read_only = true
commands = ["set process kv h_function.sigma=$(h_sigma:1.0)", "set process kv subtraction.integrated_ct_settings.range.type=infinite subtraction.integrated_ct_settings.range.h_function_settings.sigma=$(h_sigma:1.0)", "set process kv kinematics.e_cm=$(e_com:1000.0)"]

[[child.run.task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[child.run.task_queue]]
name = "havana-train"
kind = "sample"
accumulator = "latest"
stop_condition = { max_samples = "$(havana_total_nr_of_samples:50_000)" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = "$(havana_bins:64)", samples_for_update = "$(havana_samples_for_update:50_000)", initial_training_rate = 0.05, final_training_rate = 0.005 } }
queue_tuning = { target_batch_eval_ms = 1000.0, max_batch_size = "$(max_batch_size:5000)" }

[[child.run.task_queue]]
name = "reset-trial-accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[child.run.task_queue]]
name = "sample"
kind = "sample"
accumulator = "latest"
measurement = { mode = "minimize", quantity = { metric = "rsd" } }
stop_condition = { min_samples = "$(trial_min_samples:10_000)", max_samples = "$(trial_max_samples:10_000_000)", relative_error = "$(trial_rsd_relative_error:0.25)", metric = { name = "rsd" } }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
queue_tuning = { target_batch_eval_ms = 1000.0, max_batch_size = "$(max_batch_size:5000)" }

[child.replacements]
state_folder = "$(state_folder:\"../gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state\")"
havana_total_nr_of_samples = "$(havana_total_nr_of_samples:50000)"
havana_bins = "$(havana_bins:64)"
havana_samples_for_update = "$(havana_samples_for_update:10000)"
trial_min_samples = "$(trial_min_samples:10000)"
trial_max_samples = "$(trial_max_samples:100000)"
trial_rsd_relative_error = "$(trial_rsd_relative_error:0.1)"
max_batch_size = "$(max_batch_size:10000)"
