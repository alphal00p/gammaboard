# GammaLoop 1L massive six-photon h-function sigma / center-of-mass energy scan.
#
# Source state:
#
#   ../gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state
#
# Recreate it from the GammaLoop checkout with:
#
#   ./gammaloop ./glnis_gammaloop_examples/6photons/massive/1L/1L_6photons_massive.toml run generate integrate -c "quit -o"
#
# This template scans two runtime parameters through GammaLoop post-load /
# pre-initialization commands:
#
#   h_sigma -> default_runtime_settings.h_function.sigma
#           -> default_runtime_settings.subtraction.integrated_ct_settings.range.h_function_settings.sigma
#   e_com   -> default_runtime_settings.kinematics.e_cm
#
# GammaLoop calls the center-of-mass energy setting `e_cm`; the scan parameter
# is named `e_com` here to match the operator-facing search label.
#
# The default `state_folder` is an absolute path for the sibling checkout layout
# used during development. For a portable deployment, either pass a replacement
# for `state_folder` or start Gammaboard with:
#
#   --resource-root ../gammaloop/glnis_gammaloop_examples/6photons/massive/1L
#
# and set `state_folder = "state"` in the replacements.

replacements = { run_name = "gammaloop_6photons_hsigma_ecom_scan", state_folder = "/home/cedricsigrist/Workspace/repos/gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state", train_samples = 20000, sample_samples = 100000, havana_bins = 64, samples_for_update = 5000, max_batch_size = 5000, max_concurrent_runs = 1 }

name = '$(run_name:"gammaloop_6photons_hsigma_ecom_scan")'

# The parent scan task only orchestrates child runs. The GammaLoop evaluator is
# created inside each child with that child's scanned runtime settings.

[[task_queue]]
name = "h-sigma-e-com-scan"
kind = "parameter_scan"
max_concurrent_runs = "$(max_concurrent_runs:1)"
trial_run_toml = """
name = '6photons-hsigma-$(h_sigma:1.0)-ecom-$(e_com:1000.0)'

[evaluator]
kind = "gammaloop"
state_folder = '$(state_folder:"/home/cedricsigrist/Workspace/repos/gammaloop/glnis_gammaloop_examples/6photons/massive/1L/state")'
integrand_name = "default"

[evaluator.preprocessing]
read_only = true
commands = [
  'set default-runtime kv h_function.sigma=$(h_sigma:1.0)',
  'set default-runtime kv subtraction.integrated_ct_settings.range.type=infinite subtraction.integrated_ct_settings.range.h_function_settings.sigma=$(h_sigma:1.0)',
  'set default-runtime kv kinematics.e_cm=$(e_com:1000.0)',
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = "$(train_samples:20000)" }
accumulator = "latest"

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = "$(havana_bins:64)"
samples_for_update = "$(samples_for_update:5000)"
initial_training_rate = 0.05
final_training_rate = 0.005

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:5000)"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = { metric = "rsd" }, mode = "minimize" }
stop_condition = { max_samples = "$(sample_samples:100000)" }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
accumulator = "latest"

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:5000)"
"""

[[task_queue.parameters]]
name = "h_sigma"
values = [0.25, 0.5, 1.0, 2.0, 4.0]

[[task_queue.parameters]]
name = "e_com"
values = [500.0, 750.0, 1000.0, 1250.0, 1500.0]

[task_queue.measurement]
source_task = "sample"
