# =============================================================================
# e+ e- -> mu+ mu-  at LO, sqrt(s) = 1000 GeV  --  MadGraph7 / MadSpace
# DIAGNOSTIC: isolate the colour factor from the quark charge.
# =============================================================================
#
# mu+ mu- has charge Q = 1 and colour N_c = 1, so the textbook LO cross section
# is exactly sigma_0 = 4*pi*alpha^2/(3 s) ~= 9.289e-2 pb (pure photon; the Z at
# 1 TeV shifts it at the ~1% level). This breaks the down-quark degeneracy seen
# in ee_ddx, where N_c*Q_d^2 = 1/3 made "3x too high" and "muon-like" coincide:
#
#   * If this run returns ~9.29e-2 pb  -> the leptonic path is correct and the
#                                         ee_ddx factor 3 is a quark-colour
#                                         over-count.
#   * If this run returns ~3 * 9.29e-2 -> MadSpace over-counts colour even for
#                                         leptons (an unconditional N_c factor).
#
# Artifact: the ee_mumu MG7 state already ships in this repo. Its run card has
# been set to e_cm = 1000.0, leptonic = true. (Re)generate with:
#
#   mkdir -p integrations/madgraph/artifacts/ee_mumu
#   python /home/cedricsigrist/Workspace/repos/MadGraph7/bin/mg5_aMC <<'EOF'
#   import model sm
#   generate e+ e- > mu+ mu-
#   output integrations/madgraph/artifacts/ee_mumu/mg7_state -f
#   quit
#   EOF
#   # then edit Cards/run_card.toml [beam]: e_cm = 1000.0, leptonic = true
#
# Run with:
#   gammaboard run add resources/templates/runs/ee_mumu_madgraph.toml
# =============================================================================

replacements = { run_name = "ee_mumu_madgraph", train_samples = 1000000, sample_samples = 10000000, havana_bins = 128, samples_for_update = 50000, max_batch_size = 10000, continuous_dims = 2 }

name = '$(run_name:"ee_mumu_madgraph")'
# Scalar target so the central-value panel picks it up (overlay is matched by
# component name "value"/"real", not the accumulator's "weight").
target = 9.289e-2

[evaluator]
kind = "process_evaluator"
command = ["$resources/../integrations/madgraph/.venv/bin/madgraph-gammaboard-evaluator"]
cwd = "$resources/.."
domain = { continuous = { dims = "$(continuous_dims:2)" } }
components = ["weight"]

[evaluator.args]
state_path = "integrations/madgraph/artifacts/ee_mumu/mg7_state"
madgraph_root = "/home/cedricsigrist/Workspace/repos/MadGraph7"
subprocess_index = 0
flavor_index = 0
output = ["weight"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["weight"]
training_projection = { kind = "component", name = "weight" }

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = "$(train_samples:1000000)" }
accumulator = "latest"

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = "$(havana_bins:128)"
samples_for_update = "$(samples_for_update:50000)"
initial_training_rate = 0.05
final_training_rate = 0.005

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(sample_samples:10000000)" }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
accumulator = "latest"

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"
