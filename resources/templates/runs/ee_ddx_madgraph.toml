# =============================================================================
# e+ e- -> d d~  at LO, sqrt(s) = 1000 GeV  --  MadGraph7 / MadSpace engine
# =============================================================================
#
# Total LO cross section of e+ e- -> d d~ (gamma + Z s-channel, full SM) at a
# fixed centre-of-mass energy of 1000 GeV, via the MadGraph7/MadSpace
# tree-level matrix element x flat phase space wrapper.
#
# This is the MadGraph half of a two-engine comparison; the GammaLoop half
# lives in ee_ddx_gammaloop.toml. Both use identical SM inputs (aEWM1=132.507,
# Gf=1.16639e-5, MZ=91.188, ...) and the same fixed sqrt(s)=1000 GeV
# (beams 500+500 GeV, no PDF), so the cross sections are directly comparable in
# picobarns. The GammaLoop reference value is 3.097e-2 pb.
#
# Run with (override continuous_dims with the printed random_dim, see below):
#   gammaboard run add resources/templates/runs/ee_ddx_madgraph.toml \
#       --replace continuous_dims=<random_dim>
#
# -----------------------------------------------------------------------------
# ARTIFACT -- MadGraph7 / MadSpace state for e+ e- -> d d~
# -----------------------------------------------------------------------------
# One-time wrapper setup:
#
#   cd integrations/madgraph
#   python -m venv .venv && . .venv/bin/activate
#   python -m pip install --upgrade pip
#   python -m pip install --force-reinstall .
#
# Generate the MG7 state (from repos/gammaboard):
#
#   mkdir -p integrations/madgraph/artifacts/ee_ddx
#   python /home/cedricsigrist/Workspace/repos/MadGraph7/bin/mg5_aMC <<'EOF'
#   import model sm
#   generate e+ e- > d d~
#   output integrations/madgraph/artifacts/ee_ddx/mg7_state -f
#   quit
#   EOF
#
# Fix the collider to monochromatic e+e- beams at sqrt(s)=1000 GeV with NO PDF
# so it matches GammaLoop's fixed externals. Edit the [beam] table in
# integrations/madgraph/artifacts/ee_ddx/mg7_state/Cards/run_card.toml and set:
#
#   [beam]
#   e_cm = 1000.0
#   leptonic = true
#
# Print the MadSpace callable random_dim and pass it as continuous_dims:
#
#   cd integrations/madgraph && . .venv/bin/activate
#   python - <<'EOF'
#   from madgraph_gammaboard.state import MadSpaceState
#   s = MadSpaceState.load(
#       state_path="integrations/madgraph/artifacts/ee_ddx/mg7_state",
#       madgraph_root="/home/cedricsigrist/Workspace/repos/MadGraph7",
#       subprocess_index=0, flavor_index=0,
#   )
#   print("random_dim =", s.random_dim)
#   EOF
#
# A 2->2 final state is typically 2, but always confirm with the print above;
# domain.continuous.dims MUST equal MadSpaceState.random_dim.
# =============================================================================

replacements = { run_name = "ee_ddx_madgraph", samples = 1000000, continuous_dims = 2 }

name = '$(run_name:"ee_ddx_madgraph")'
target = { kind = "vector", components = { weight = 3.097e-2 } }

[evaluator]
kind = "process_evaluator"
command = ["$resources/../integrations/madgraph/.venv/bin/madgraph-gammaboard-evaluator"]
cwd = "$resources/.."
domain = { continuous = { dims = "$(continuous_dims:2)" } }   # must equal MadSpaceState.random_dim
components = ["weight"]

[evaluator.args]
state_path = "integrations/madgraph/artifacts/ee_ddx/mg7_state"
madgraph_root = "/home/cedricsigrist/Workspace/repos/MadGraph7"
subprocess_index = 0
flavor_index = 0
output = ["weight"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["weight"]
training_projection = { kind = "component", name = "weight" }

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(samples:1000000)" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 4096 } }
