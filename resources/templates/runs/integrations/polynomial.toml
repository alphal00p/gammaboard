# Reusable polynomial integration for parameter scans.
name = "polynomial-scale-$(scale:1)-offset-$(offset:1)-curvature-$(curvature:0)"

[evaluator]
kind = "symbolica"
args = ["x"]
source = {kind = "expression", expr = "offset + scale * x + curvature * (x^2 - 1/3)", constants = { offset = "$(offset:\"1\")", scale = "$(scale:\"1\")", curvature = "$(curvature:\"0\")" }}

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { selection = { kind = "all_component_means" } }
stop_condition = { max_samples = "$(scan_samples:4096)" }
accumulator = { config = "scalar" }
sampler = { config = { kind = "naive_monte_carlo", seed = 0 } }
