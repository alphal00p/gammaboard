# =============================================================================
# Same process, two engines: e+ e- -> d d~  at LO, sqrt(s) = 1000 GeV
# =============================================================================
#
# This file computes the SAME physics observable -- the total LO cross section
# of e+ e- -> d d~ (gamma + Z s-channel, full SM) at a fixed centre-of-mass
# energy of 1000 GeV -- with two independent engines:
#
#   * GammaLoop  (Local Unitarity, optical-theorem cut of the photon/Z
#                 self-energy with the d d~ pair in the loop)
#   * MadGraph7 / MadSpace  (tree-level matrix element x flat phase space)
#
# Both use identical SM inputs (aEWM1=132.507, Gf=1.16639e-5, MZ=91.188, ...)
# and the same fixed sqrt(s)=1000 GeV (beams 500+500 GeV, no PDF), so the two
# cross sections are directly comparable in picobarns. GammaLoop's reference
# value for this process/energy is 3.097e-2 pb.
#
# -----------------------------------------------------------------------------
# IMPORTANT: gammaboard runs ONE evaluator per config (`run add` -> one run).
# You therefore submit this comparison as TWO runs:
#
#   gammaboard run add resources/templates/runs/ee_ddx_madgraph_vs_gammaloop.toml
#       -> creates the GammaLoop run (the live TOML body below)
#
#   # copy the "MADGRAPH RUN" block at the bottom into ee_ddx_madgraph.toml, then:
#   gammaboard run add ee_ddx_madgraph.toml
#       -> creates the MadGraph run
#
# Both runs share the same name prefix "ee_ddx_<engine>" so they sit together
# in the dashboard for side-by-side comparison.
# =============================================================================
#
# -----------------------------------------------------------------------------
# ARTIFACT 1 -- GammaLoop state for e+ e- -> d d~ @ LO
# -----------------------------------------------------------------------------
# The CLI example card ships with the gammaloop checkout. Generate the state and
# move it under resources/states so the relative state_folder below resolves:
#
#   cd /home/cedricsigrist/Workspace/repos/gammaloop
#   ./gammaloop --clean-state ./examples/cli/epem_a_ddx/LO/epem_a_ddx.toml \
#       run generate integrate -c "quit -o"
#   mkdir -p /home/cedricsigrist/Workspace/repos/gammaboard/resources/states/epem_a_ddx/LO
#   cp -r ./examples/cli/epem_a_ddx/LO/state \
#       /home/cedricsigrist/Workspace/repos/gammaboard/resources/states/epem_a_ddx/LO/state
#
# (The card already sets e_cm = 1000.0 and integral_unit = "picobarn".)
#
# -----------------------------------------------------------------------------
# ARTIFACT 2 -- MadGraph7 / MadSpace state for e+ e- -> d d~
# -----------------------------------------------------------------------------
# One-time wrapper setup:
#
#   cd integrations/madgraph
#   python -m venv .venv && . .venv/bin/activate
#   python -m pip install --upgrade pip
#   python -m pip install --force-reinstall .
#
# Generate the MG7 state (from repos/gammaboard):
#
#   mkdir -p integrations/madgraph/artifacts/ee_ddx
#   python /home/cedricsigrist/Workspace/repos/MadGraph7/bin/mg5_aMC <<'EOF'
#   import model sm
#   generate e+ e- > d d~
#   output integrations/madgraph/artifacts/ee_ddx/mg7_state -f
#   quit
#   EOF
#
# Fix the collider to monochromatic 500+500 GeV e+e- beams with NO PDF so it
# matches GammaLoop's fixed externals. Edit the run card
# integrations/madgraph/artifacts/ee_ddx/mg7_state/Cards/run_card.dat and set:
#
#   lpp1 = 0
#   lpp2 = 0
#   ebeam1 = 500.0
#   ebeam2 = 500.0
#
# Print the MadSpace callable random_dim and pass it as continuous_dims below:
#
#   cd integrations/madgraph && . .venv/bin/activate
#   python - <<'EOF'
#   from madgraph_gammaboard.state import MadSpaceState
#   s = MadSpaceState.load(
#       state_path="integrations/madgraph/artifacts/ee_ddx/mg7_state",
#       madgraph_root="/home/cedricsigrist/Workspace/repos/MadGraph7",
#       subprocess_index=0, flavor_index=0,
#   )
#   print("random_dim =", s.random_dim)
#   EOF
#
# Override it on the MadGraph run with --replace continuous_dims=<random_dim>
# (a 2->2 final state is typically 2, but always confirm with the print above).
# =============================================================================


# ============================ GAMMALOOP RUN (live) ===========================

replacements = { run_name = "ee_ddx_gammaloop", train_samples = 100000, sample_samples = 1000000, havana_bins = 128, samples_for_update = 10000, max_batch_size = 10000 }

name = '$(run_name:"ee_ddx_gammaloop")'
target = { kind = "vector", components = { real = 3.097e-2, imag = 0.0 } }

[evaluator]
kind = "gammaloop"
state_folder = "states/epem_a_ddx/LO/state"
integrand_name = "LO"

[evaluator.preprocessing]
read_only = true
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = "$(train_samples:100000)" }
accumulator = "latest"

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = "$(havana_bins:128)"
samples_for_update = "$(samples_for_update:10000)"
initial_training_rate = 0.05
final_training_rate = 0.005

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(sample_samples:1000000)" }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
accumulator = "latest"

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"


