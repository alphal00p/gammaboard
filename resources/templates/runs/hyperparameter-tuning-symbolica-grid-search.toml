# Hyperparameter tuning; integration settings belong to the child.
kind = "hyperparameter_tuning"
name = "grid-search"
max_concurrent_trials = "$(max_concurrent_trials:2)"
replacements = { trial_samples = 8192, max_concurrent_trials = 2 }
optimizer = { algorithm = "grid_search" }
objective = { source_task = "sample", mode = "minimize", quantity = { metric = "error" } }
parameters = { center = { kind = "categorical", values = ["1/4", "1/2", "3/4"] }, roughness = { kind = "categorical", values = ["2", "4", "8"] }, havana_bins = { kind = "integer", min = 16, max = 32, step = 16 } }

[child]
replacements = { trial_samples = "$(trial_samples:8192)" }

[child.run]
name = "grid-center-$(center:1/2)-rough-$(roughness:2)-bins-$(havana_bins:16)"
target = { kind = "scalar", value = 1.0 }

[child.run.evaluator]
kind = "symbolica"
expr = "1 + roughness * ((x - center)^2 + (y - center)^2 - 2 * (center^3 + (1 - center)^3) / 3)"
args = ["x", "y"]
constants = { center = "$(center:\"1/2\")", roughness = "$(roughness:\"2\")" }

[[child.run.task_queue]]
name = "sample"
kind = "sample"
measurement = { mode = "minimize", quantity = { metric = "error" } }
stop_condition = { max_samples = "$(trial_samples:8192)" }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = "$(havana_bins:16)", samples_for_update = 512, initial_training_rate = 0.1, final_training_rate = 0.01 } }
