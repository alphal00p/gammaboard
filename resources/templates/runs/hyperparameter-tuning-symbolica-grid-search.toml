# Hyperparameter tuning; integration settings belong to the child.
kind = "hyperparameter_tuning"
name = "grid-search"
max_concurrent_trials = "$(max_concurrent_trials:2)"
replacements = { trial_samples = 8192, max_concurrent_trials = 2 }
optimizer = { algorithm = "grid_search" }
objective = { source_task = "sample", mode = "minimize", quantity = { metric = "error" } }
parameters = { center = { kind = "categorical", values = ["1/4", "1/2", "3/4"] }, roughness = { kind = "categorical", values = ["2", "4", "8"] }, havana_bins = { kind = "integer", min = 16, max = 32, step = 16 } }

[child]
replacements = { trial_samples = "$(trial_samples:8192)", samples_for_update = 512 }
run = { file = "integrations/polynomial-havana.toml" }
