# Symbolica + Havana training, then 2D PDF adaptation on a pure (x,y) domain.

name = "ghost_bump"

[evaluator]
kind = "symbolica"
expr = "1/((x-1/4)^2+(y-1/4)^2+1/20) + 1/((x-3/4)^2+(y-3/4)^2+1/20) - 1/2"
args = ["x", "y"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "scalar"

[[task_queue]]
name = "havana-train"
kind = "sample"

[task_queue.stop_condition]
max_samples = 200000

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = 64
samples_for_update = 16384
initial_training_rate = 0.1
final_training_rate = 0.001

[[task_queue]]
name = "pdf-2d"
kind = "pdf_adaptation_image"

[task_queue.geometry]
offset = [0.0, 0.0]
u_vector = [1.0, 0.0]
v_vector = [0.0, 1.0]

[task_queue.geometry.u_linspace]
start = 0.0
stop = 1.0
count = 128

[task_queue.geometry.v_linspace]
start = 0.0
stop = 1.0
count = 128
