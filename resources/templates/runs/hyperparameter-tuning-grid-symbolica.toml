# Hyperparameter tuning demo: grid-search over finite Symbolica/Havana knobs.
#
# The integrand family has exact central value 1.0:
#
#   f(x,y) = 1 + roughness * ((x-center)^2 + (y-center)^2 - offset(center))
#
# `center` and `roughness` change the shape, while `havana_bins` changes the
# sampler. The objective minimizes the measured error after a fixed sample
# budget, so the best point should prefer smoother integrands and adequate
# sampler binning.

replacements = { run_name = "hyperparameter-tuning-grid-symbolica", trial_samples = 4096, max_concurrent_trials = 2 }

name = '$(run_name:"hyperparameter-tuning-grid-symbolica")'

[[task_queue]]
name = "grid-search"
kind = "hyperparameter_tuning"
max_concurrent_trials = "$(max_concurrent_trials:2)"
trial_run_toml = """
name = "grid-center-$(center:0.5)-rough-$(roughness:2.0)-bins-$(havana_bins:16)"
target = { kind = "scalar", value = 1.0 }

[evaluator]
kind = "symbolica"
expr = "1 + $(roughness:2.0) * ((x - $(center:0.5))^2 + (y - $(center:0.5))^2 - 2 * ($(center:0.5)^3 + (1 - $(center:0.5))^3) / 3)"
args = ["x", "y"]

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = { metric = "error" }, mode = "minimize" }
stop_condition = { max_samples = "$(trial_samples:4096)" }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = "$(havana_bins:16)", samples_for_update = 512, initial_training_rate = 0.1, final_training_rate = 0.01 } }
"""

[task_queue.optimizer]
algorithm = "grid_search"

[task_queue.objective]
source_task = "sample"
mode = "minimize"
quantity = { metric = "error" }

[task_queue.parameters.center]
kind = "categorical"
values = [0.25, 0.5, 0.75]

[task_queue.parameters.roughness]
kind = "categorical"
values = [2.0, 4.0, 8.0]

[task_queue.parameters.havana_bins]
kind = "integer"
min = 16
max = 32
step = 16
