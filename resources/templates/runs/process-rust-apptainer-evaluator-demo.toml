# Apptainer-packaged Rust process evaluator with Gammaboard's built-in Monte Carlo sampler.
# Build the image first:
#   cd process_api/examples/rust_breit_wigner_evaluator
#   apptainer build runtime.sif apptainer.def

name = "process-rust-apptainer-evaluator-demo"

[evaluator]
kind = "process_evaluator"
command = ["apptainer", "exec", "process_api/examples/rust_breit_wigner_evaluator/runtime.sif", "breit-wigner-worker"]
continuous_dims = 2
discrete_cardinalities = []
args = { masses = [0.25, 0.50, 0.75], widths = [0.04, 0.06, 0.05], channel_weights = [1.0, 0.7, 1.3] }

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["value"]
training_projection = { kind = "component", name = "value" }

[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 100000 }
sampler_aggregator = { config = { kind = "naive_monte_carlo" } }
