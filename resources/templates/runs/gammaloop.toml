# Full GammaLoop + Havana training/inference example with task-level queue tuning.

replacements = { run_name = "gammaloop_tth" }

name = '$(run_name:"gammaloop_tth")'
target = { kind = "vector", components = { real = 1.563e-3, imag = 0.0 } }

[evaluator]
kind = "gammaloop"
# Assumes `gammaloop` is a sister folder of `gammaboard`.
state_folder = "states/epem_a_ttxh/LO/state"
integrand_name = "LO"

# In-memory setup derived from the GammaLoop epem_a_ttxh LO runcard.
[evaluator.preprocessing]
read_only = true
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
  """set process -p epem_a_tth -i LO string '
[sampling]
graphs = "monte_carlo"
orientations = "monte_carlo"
lmb_multichanneling = true
lmb_channels = "monte_carlo"
'""",
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"
