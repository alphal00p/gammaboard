# Dependency-free campaign steering example. Two independent sub-runs integrate
# constant graph contributions. The controller gives each graph a pilot window,
# switches persisted worker assignments between them, and reports their weighted
# sum: 2 * 1 - 0.5 * 1 = 1.5.
name = "integration-campaign-unit"
target = { kind = "scalar", value = 1.5 }

[[task_queue]]
name = "campaign"
kind = "integration_campaign"
measurement = { source_task = "sample" }
stop_condition = { min_total_samples = 1_500, max_total_samples = 4_000, absolute_error = 1e-12 }
allocation = { algorithm = "variance_reduction_rate", max_active_runs = 1, allocation_window_samples = 500, min_samples_per_child = 500 }

[[task_queue.children]]
name = "graph-a"
coefficient = 2.0
run_toml = '''
name = "campaign-unit-graph-a"
[evaluator]
kind = "unit"
continuous_dims = 1
discrete_dims = 0
min_eval_time_per_sample_ms = 1
[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 10_000 }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 1 } }
'''

[[task_queue.children]]
name = "graph-b"
coefficient = -0.5
run_toml = '''
name = "campaign-unit-graph-b"
[evaluator]
kind = "unit"
continuous_dims = 1
discrete_dims = 0
min_eval_time_per_sample_ms = 1
[[task_queue]]
name = "sample"
kind = "sample"
stop_condition = { max_samples = 10_000 }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 2 } }
'''
