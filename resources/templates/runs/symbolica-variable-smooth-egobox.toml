# Hyperparameter tuning; integration settings belong to the child.
kind = "hyperparameter_tuning"
name = "$(run_name:\"symbolica_variable_theta_egobox\")"
max_concurrent_trials = "$(max_concurrent_trials:2)"
replacements = { run_name = "symbolica_variable_theta_egobox", fixed_mass = 1.0, trial_samples = 50000, max_trials = 16, max_concurrent_trials = 2 }
optimizer = { algorithm = "egobox", params = { max_trials = "$(max_trials:16)", seed = 23, initial_design = 6, parallel_candidates = "$(max_concurrent_trials:2)", infill = "ei", qei_strategy = "kriging_believer" } }
objective = { source_task = "sample", mode = "minimize", quantity = { metric = "time_normalized_variance", component = "real" } }

[parameters]
subtraction_width = { kind = "float", min = 0.15, max = 2.0 }
mask_width = { kind = "float", min = 0.15, max = 2.0 }
max_eta_min = { kind = "categorical", values = [0.0, 10000000000.0] }
havana_bins = { kind = "integer", min = 16, max = 96, step = 16 }
samples_for_update = { kind = "integer", min = 512, max = 4096, step = 512 }

[child]
replacements = { fixed_mass = "$(fixed_mass:1.0)", trial_samples = "$(trial_samples:50000)" }

run = '''
name = "variable-theta-egobox-m$(fixed_mass:1.0)-sw$(subtraction_width:0.5)-mw$(mask_width:0.5)-eta$(max_eta_min:10000000000.0)-bins$(havana_bins:64)"
target = { kind = "vector", components = { real = 0.0, imag = 0.0 } }

[evaluator]
kind = "symbolica"
args = ["k0", "k1", "k2"]
compiled_args = ["pi", "a", "b", "c", "subtraction_width", "max_imag_root_part", "max_eta_min", "mask_width", "m0", "m1", "m2", "q0_0", "q0_1", "q0_2", "q0_3", "q1_0", "q1_1", "q1_2", "q1_3", "q2_0", "q2_1", "q2_2", "q2_3", "k0", "k1", "k2"]
source = { kind = "compiled", path = "artifacts/variable_theta.so", name = "variable_theta", outputs = 1 }

[evaluator.bindings]
pi = "pi"
a = 1.0
b = 1.0
c = 1.0
subtraction_width = "$(subtraction_width:0.5)"
max_imag_root_part = 1000000000000000.0
max_eta_min = "$(max_eta_min:10000000000.0)"
mask_width = "$(mask_width:0.5)"
m0 = "$(fixed_mass:1.0)"
m1 = "$(fixed_mass:1.0)"
m2 = "$(fixed_mass:1.0)"
q0_0 = -1.76776695
q0_1 = 0.0
q0_2 = 0.0
q0_3 = 0.35355339
q1_0 = 0.0
q1_1 = 0.0
q1_2 = 0.0
q1_3 = 0.0
q2_0 = 1.06066017
q2_1 = 0.0
q2_2 = 0.0
q2_3 = 0.35355339

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { mode = "minimize", quantity = { metric = "time_normalized_variance", component = "real" } }
stop_condition = { max_samples = "$(trial_samples:50000)" }
accumulator = { config = { kind = "vector", components = ["real", "imag"], training_projection = { kind = "component", name = "real" }, moments = { max_order = 4 } } }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = "$(havana_bins:64)", samples_for_update = "$(samples_for_update:2048)", initial_training_rate = 0.1, final_training_rate = 0.01 } }

[[task_queue.batch_transforms]]
kind = "spherical"
'''
