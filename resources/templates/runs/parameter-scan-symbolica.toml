# Parameter scan demo: compare 1D, 2D, and 3D Cartesian scans.
#
# Each child run integrates
#
#   f(x) = offset + scale * x + curvature * (x^2 - 1/3)
#
# on [0,1]. The exact central value is offset + scale / 2 because the
# curvature term integrates to zero. This makes the 3D scan useful for testing
# multi-parameter plumbing without making the central value hard to predict.

replacements = { run_name = "parameter-scan-symbolica", scan_samples = 4096, max_concurrent_runs = 2 }

name = '$(run_name:"parameter-scan-symbolica")'

# The parent scan task only orchestrates child runs. This evaluator defines the
# parent run domain and is intentionally cheap.
[evaluator]
kind = "symbolica"
expr = "1"
args = ["x"]

[[task_queue]]
name = "scale-scan-1d"
kind = "parameter_scan"
max_concurrent_runs = "$(max_concurrent_runs:2)"
trial_run_toml = """
name = "scan-1d-scale-$(scale:1)"

[evaluator]
kind = "symbolica"
expr = "offset + scale * x + curvature * (x^2 - 1/3)"
args = ["x"]
constants = { offset = '$(offset:"1")', scale = '$(scale:"1")', curvature = '$(curvature:"0")' }

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(scan_samples:4096)" }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 0 } }
"""

[[task_queue.parameters]]
name = "scale"
values = ["0", "1/2",  "1", "3/2", "2"]

[task_queue.measurement]
source_task = "sample"

[[task_queue]]
name = "scale-offset-scan-2d"
kind = "parameter_scan"
max_concurrent_runs = "$(max_concurrent_runs:2)"
trial_run_toml = """
name = "scan-2d-scale-$(scale:1)-offset-$(offset:1)"

[evaluator]
kind = "symbolica"
expr = "offset + scale * x + curvature * (x^2 - 1/3)"
args = ["x"]
constants = { offset = '$(offset:"1")', scale = '$(scale:"1")', curvature = '$(curvature:"0")' }

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(scan_samples:4096)" }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 0 } }
"""

[[task_queue.parameters]]
name = "scale"
values = ["0", "1", "2"]

[[task_queue.parameters]]
name = "offset"
values = ["1/2", "1", "3/2"]

[task_queue.measurement]
source_task = "sample"

[[task_queue]]
name = "scale-offset-curvature-scan-3d"
kind = "parameter_scan"
max_concurrent_runs = "$(max_concurrent_runs:2)"
trial_run_toml = """
name = "scan-3d-scale-$(scale:1)-offset-$(offset:1)-curvature-$(curvature:0)"

[evaluator]
kind = "symbolica"
expr = "offset + scale * x + curvature * (x^2 - 1/3)"
args = ["x"]
constants = { offset = '$(offset:"1")', scale = '$(scale:"1")', curvature = '$(curvature:"0")' }

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(scan_samples:4096)" }
accumulator = { config = "scalar" }
sampler_aggregator = { config = { kind = "naive_monte_carlo", seed = 0 } }
"""

[[task_queue.parameters]]
name = "scale"
values = ["0", "1"]

[[task_queue.parameters]]
name = "offset"
values = ["1/2", "1"]

[[task_queue.parameters]]
name = "curvature"
values = ["-1", "0", "1"]

[task_queue.measurement]
source_task = "sample"
