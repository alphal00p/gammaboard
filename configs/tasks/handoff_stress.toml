# Short handoff stress test covering resume, image, and PDF adaptation.

[[task_queue]]
name = "train"
kind = "sample"
nr_samples = 8_192
batch_transforms = [{ kind = "spherical" }]
observable = { config = "complex" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 32, samples_for_update = 2_048, initial_training_rate = 0.1, final_training_rate = 0.01 } }

[[task_queue]]
name = "infer"
kind = "sample"
nr_samples = 4_096
sampler_aggregator = { config = { kind = "havana_inference" } }

[[task_queue]]
name = "train2"
kind = "sample"
nr_samples = 4_096
batch_transforms = [{ kind = "spherical" }]
sampler_aggregator = { from_name = "infer" }
observable = { from_name = "infer" }

[[task_queue]]
name = "infer2"
kind = "sample"
nr_samples = 4_096
sampler_aggregator = { config = { kind = "havana_inference" } }

[[task_queue]]
name = "image"
kind = "image"
observable = "complex"
batch_transforms = []

[task_queue.geometry]
offset = [0.0, 0.0, 0.0]
u_vector = [1.0, 0.0, 0.0]
v_vector = [0.0, 0.0, 1.0]
u_linspace = { start = -8.0, stop = 8.0, count = 128 }
v_linspace = { start = -8.0, stop = 8.0, count = 128 }
discrete = []

[[task_queue]]
name = "pdf"
kind = "pdf_adaptation_image"
sampler_aggregator = { from_name = "infer2" }
batch_transforms = []

[task_queue.geometry]
offset = [0.0, 0.0, 0.0]
u_vector = [1.0, 0.0, 0.0]
v_vector = [0.0, 0.0, 1.0]
u_linspace = { start = 0.0, stop = 1.0, count = 96 }
v_linspace = { start = 0.0, stop = 1.0, count = 96 }
discrete = []
