# Train a Havana sampler, then rasterize its PDF.

[[task_queue]]
name = "train"
kind = "sample"
nr_samples = 100_000
accumulator = { config = "complex" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 16384, initial_training_rate = 0.1, final_training_rate = 0.001 } }

[[task_queue]]
name = "pdf"
kind = "pdf_adaptation_image"
batch_transforms = []

[task_queue.geometry]
offset = [0.0, 0.0]
u_vector = [1.0, 0.0]
v_vector = [0.0, 1.0]
u_linspace = { start = 0.0, stop = 1.0, count = 128 }
v_linspace = { start = 0.0, stop = 1.0, count = 128 }
