# Triangle handoff workflow with training resume, line plot, and image tasks.

[[task_queue]]
name = "train"
kind = "sample"
nr_samples = 100_000
batch_transforms = [{ kind = "spherical" }]
observable = { config = "complex" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 16384, initial_training_rate = 0.1, final_training_rate = 0.001 } }

[[task_queue]]
name = "infer"
kind = "sample"
nr_samples = 100_000
sampler_aggregator = { config = { kind = "havana_inference" } }

[[task_queue]]
name = "line"
kind = "plot_line"
observable = "complex"
batch_transforms = []
[task_queue.geometry]
offset = [0.0, 0.0, 0.0]
direction = [1.0, 0.0, 0.0]
linspace = { start = -10.0, stop = 10.0, count = 1024 }
discrete = []

[[task_queue]]
name = "image"
kind = "image"
observable = "complex"
batch_transforms = []
[task_queue.geometry]
offset = [0.0, 0.0, 0.0]
u_vector = [1.0, 0.0, 0.0]
v_vector = [0.0, 0.0, 1.0]
u_linspace = { start = -50.0, stop = 50.0, count = 512 }
v_linspace = { start = -50.0, stop = 50.0, count = 512 }
discrete = []

[[task_queue]]
name = "train2"
kind = "sample"
nr_samples = 100_000
batch_transforms = [{ kind = "spherical" }]
sampler_aggregator = { from_name = "infer" }
observable = { from_name = "infer" }

[[task_queue]]
name = "infer2"
kind = "sample"
nr_samples = 100_000
sampler_aggregator = { config = { kind = "havana_inference" } }
