# Example GammaLoop run.
# Assumes `gammaloop` is a sister folder of `gammaboard`.

name = "tth"

[evaluator]
kind = "gammaloop"
state_folder = "../gammaloop/examples/cli/epem_a_ttxh/LO/state"
integrand_name = "LO"
momentum_space = false


[evaluator_runner_params]
performance_snapshot_interval_ms = 2000
db_pool_size = 2

[sampler_aggregator_runner_params]
performance_snapshot_interval_ms = 2000
min_tick_time_ms = 10
frontend_sync_interval_ms = 2000
target_batch_eval_ms = 500.0
max_batch_size = 131072
db_pool_size = 16

[sampler_aggregator_runner_params.queue]
queue_buffer = 10.0
local_pending_buffer_multiplier = 1.0
max_queue_size = 192
max_batches_per_tick = 64
max_insert_bundle_size = 1
max_concurrent_insert_tasks = 12
completed_batch_fetch_limit = 64
strict_batch_ordering = true

[[task_queue]]
name = "havana-train-10m"
kind = "sample"
nr_samples = 100_000_000
observable = { config = "gammaloop" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 128, samples_for_update = 10_000_000, initial_training_rate = 0.05, final_training_rate = 0.005 } }

[[task_queue]]
name = "havana-infer-100m"
kind = "sample"
nr_samples = 100_000_000
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
