kind = "hyperparameter_tuning"
name = "$(run_name:\"symbolica_variable_theta_egobox\")"
max_concurrent_trials = "$(max_concurrent_trials:2)"

[replacements]
run_name = "symbolica_variable_theta_egobox"
fixed_mass = 1.0
trial_samples = 50000
max_trials = 16
max_concurrent_trials = 2

[optimizer]
algorithm = "egobox"

[optimizer.params]
max_trials = "$(max_trials:16)"
seed = 23
initial_design = 6
parallel_candidates = "$(max_concurrent_trials:2)"
infill = "ei"
qei_strategy = "kriging_believer"

[objective]
source_task = "sample"
mode = "minimize"

[objective.selection]
kind = "metric"
name = "time_normalized_variance"
component = "real"

[parameters.subtraction_width]
kind = "float"
min = 0.15
max = 2.0

[parameters.mask_width]
kind = "float"
min = 0.15
max = 2.0

[parameters.max_eta_min]
kind = "categorical"
values = [0.0, 10000000000.0]

[parameters.havana_bins]
kind = "integer"
min = 16
max = 96
step = 16

[parameters.samples_for_update]
kind = "integer"
min = 512
max = 4096
step = 512

[child]
run = "name = \"variable-theta-egobox-m$(fixed_mass:1.0)-sw$(subtraction_width:0.5)-mw$(mask_width:0.5)-eta$(max_eta_min:10000000000.0)-bins$(havana_bins:64)\"\n\n[target]\nkind = \"vector\"\n\n[target.components]\nreal = 0.0\nimag = 0.0\n\n[evaluator]\nkind = \"symbolica\"\nargs = [\"k0\", \"k1\", \"k2\"]\n\n[evaluator.source]\nkind = \"compiled\"\npath = \"artifacts/variable_theta.so\"\nname = \"variable_theta\"\noutputs = 1\ncompiled_args = [\"pi\", \"a\", \"b\", \"c\", \"subtraction_width\", \"max_imag_root_part\", \"max_eta_min\", \"mask_width\", \"m0\", \"m1\", \"m2\", \"q0_0\", \"q0_1\", \"q0_2\", \"q0_3\", \"q1_0\", \"q1_1\", \"q1_2\", \"q1_3\", \"q2_0\", \"q2_1\", \"q2_2\", \"q2_3\", \"k0\", \"k1\", \"k2\"]\n\n[evaluator.source.bindings]\npi = \"pi\"\na = 1.0\nb = 1.0\nc = 1.0\nsubtraction_width = \"$(subtraction_width:0.5)\"\nmax_imag_root_part = 1000000000000000.0\nmax_eta_min = \"$(max_eta_min:10000000000.0)\"\nmask_width = \"$(mask_width:0.5)\"\nm0 = \"$(fixed_mass:1.0)\"\nm1 = \"$(fixed_mass:1.0)\"\nm2 = \"$(fixed_mass:1.0)\"\nq0_0 = -1.76776695\nq0_1 = 0.0\nq0_2 = 0.0\nq0_3 = 0.35355339\nq1_0 = 0.0\nq1_1 = 0.0\nq1_2 = 0.0\nq1_3 = 0.0\nq2_0 = 1.06066017\nq2_1 = 0.0\nq2_2 = 0.0\nq2_3 = 0.35355339\n\n[[task_queue]]\nname = \"sample\"\nkind = \"sample\"\n\n[task_queue.measurement]\nmode = \"minimize\"\n\n[task_queue.measurement.selection]\nkind = \"metric\"\nname = \"time_normalized_variance\"\ncomponent = \"real\"\n\n[task_queue.stop_condition]\nmax_samples = \"$(trial_samples:50000)\"\n\n[task_queue.accumulator.config]\nkind = \"vector\"\ncomponents = [\"real\", \"imag\"]\nmoments = 4\n\n[task_queue.accumulator.config.training_projection]\nkind = \"component\"\nname = \"real\"\n\n[task_queue.sampler.config]\nkind = \"havana_training\"\nseed = 0\nbins = \"$(havana_bins:64)\"\nsamples_for_update = \"$(samples_for_update:2048)\"\ninitial_training_rate = 0.1\nfinal_training_rate = 0.01\n\n[[task_queue.sampler.config.transforms]]\nkind = \"spherical\"\n"

[child.replacements]
fixed_mass = "$(fixed_mass:1.0)"
trial_samples = "$(trial_samples:50000)"
