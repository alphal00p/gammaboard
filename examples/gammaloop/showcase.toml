# Native one-loop gg -> HHH GL15 amplitude at the upstream physical benchmark.
# prepare_showcase generates this state with GammaBoard's pinned GammaLoop.
commands = []
[cli_settings.global.n_cores]
feyngen = 4
generate = 4
compile = 4
integrate = 4
[cli_settings.global.generation.compile]
compilation_mode = "assembly"
optimization_level = "O1"
fast_math = true
unsafe_math = true
[cli_settings.global.generation.evaluator]
iterative_orientation_optimization = false
store_atom = false
compile = true
summed = false
summed_function_map = true
[cli_settings.global.generation.threshold_subtraction]
enable_thresholds = true
check_esurface_at_generation = true
[default_runtime_settings.general]
evaluator_method = "SummedFunctionMap"
enable_cache = false
generate_events = false
[default_runtime_settings.kinematics.externals]
type = "constant"
[default_runtime_settings.kinematics.externals.data]
momenta = [
  [500.0,0.0,0.0,500.0], [500.0,0.0,0.0,-500.0],
  [438.5555662246945,155.3322001835378,348.0160396513587,-177.3773615718412],
  [356.3696374921922,-16.802389008511,-318.7291102436005,97.48719163688098],
  "dependent"
]
helicities = [1,1,0,0,0]
[default_runtime_settings.sampling]
graphs = "summed"
orientations = "summed"
lmb_multichanneling = false
sampling_channels = "summed"
coordinate_system = "spherical"
mapping = "linear"
b = 1.0
[default_runtime_settings.subtraction]
disable_threshold_subtraction = false
[default_runtime_settings.stability]
rotation_axis = []
[default_runtime_settings.quantities.integral]
type = "integral"
[default_runtime_settings.quantities.graph]
type = "graph_id"
[default_runtime_settings.quantities.higgs_pt]
type = "particle"
pdgs = [25]
quantity = "PT"
[[command_blocks]]
name = "generate"
commands = [
  "import model sm-default.json",
  """generate amp g g > h h h / u d c s b QED==3 [{1}]
    --only-diagrams --numerator-grouping only_detect_zeroes --select-graphs GL15
    --loop-momentum-bases GL15=8
    --global-prefactor-projector 'gammalooprs::ϵ(0,spenso::mink(4,gammalooprs::hedge(0))) * gammalooprs::ϵ(1,spenso::mink(4,gammalooprs::hedge(1))) * (1/8)*spenso::g(spenso::coad(8,gammalooprs::hedge(0)),spenso::coad(8,gammalooprs::hedge(1)))'
    -p gg_hhh -i 1L""",
  "generate",
  "set model MT=173.0 WT=0.0 ymt=173.0",
  "save state -o",
]

[default_runtime_settings.observables.integral_re]
title = "Amplitude: real"
quantity = "integral"
phase = "real"
kind = "discrete"
domain = { type = "single_bin" }
labels = { type = "custom", labels = ["real amplitude"] }
[default_runtime_settings.observables.graph_re]
title = "Graph contribution: real"
quantity = "graph"
phase = "real"
kind = "discrete"
domain = { type = "graph_ids" }
labels = { type = "graph_name" }
[default_runtime_settings.observables.higgs_pt_re]
title = "External Higgs pT, real amplitude weight"
quantity = "higgs_pt"
phase = "real"
x_min = 0.0
x_max = 500.0
n_bins = 16

[default_runtime_settings.observables.integral_im]
title = "Amplitude: imag"
quantity = "integral"
phase = "imag"
kind = "discrete"
domain = { type = "single_bin" }
labels = { type = "custom", labels = ["imag amplitude"] }
[default_runtime_settings.observables.graph_im]
title = "Graph contribution: imag"
quantity = "graph"
phase = "imag"
kind = "discrete"
domain = { type = "graph_ids" }
labels = { type = "graph_name" }
[default_runtime_settings.observables.higgs_pt_im]
title = "External Higgs pT, imag amplitude weight"
quantity = "higgs_pt"
phase = "imag"
x_min = 0.0
x_max = 500.0
n_bins = 16
