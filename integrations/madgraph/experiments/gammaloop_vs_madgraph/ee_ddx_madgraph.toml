# e+ e- -> d d~ at LO, sqrt(s) = 1000 GeV, photon only (Z forbidden via "/ z").
# MadGraph7/MadSpace half of the GammaLoop comparison; physics/results in ./README.md.
#
# Run from the gammaboard repo root:
#   gammaboard run create integrations/madgraph/experiments/gammaloop_vs_madgraph/ee_ddx_madgraph.toml
#
# Build the artifact (from repo root; MadGraph7 a sister dir of gammaboard, and
# the wrapper venv at integrations/madgraph/.venv installed -- see ../../README.md):
#   mkdir -p integrations/madgraph/artifacts/ee_ddx_photon
#   python ../MadGraph7/bin/mg5_aMC <<'EOF'
#   import model sm
#   generate e+ e- > d d~ / z
#   output integrations/madgraph/artifacts/ee_ddx_photon/mg7_state -f
#   quit
#   EOF
#   # then set [beam] e_cm=1000.0, leptonic=true in the state's Cards/run_card.toml
#
# continuous_dims must equal MadSpaceState.random_dim (2 for this 2->2 state).

replacements = { run_name = "ee_ddx_photon_madgraph", train_samples = 1000000, sample_samples = 10000000, havana_bins = 128, samples_for_update = 50000, max_batch_size = 10000, continuous_dims = 2 }

name = '$(run_name:"ee_ddx_photon_madgraph")'
# Scalar target (GammaLoop reference). Must be scalar: the panel target overlay
# matches component names "value"/"real", not the accumulator's "weight".
target = 3.097e-2

[evaluator]
kind = "process_evaluator"
command = ["$resources/../integrations/madgraph/.venv/bin/madgraph-gammaboard-evaluator"]
cwd = "$resources/.."
domain = { continuous = { dims = "$(continuous_dims:2)" } }   # must equal MadSpaceState.random_dim
components = ["weight"]

[evaluator.args]
state_path = "integrations/madgraph/artifacts/ee_ddx_photon/mg7_state"
# Resolved against cwd (repo root). Sister dir of gammaboard; set an absolute
# path if elsewhere, or omit if `madgraph` is already on the worker's PYTHONPATH.
madgraph_root = "../MadGraph7"
subprocess_index = 0
flavor_index = 0
output = ["weight"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["weight"]
training_projection = { kind = "component", name = "weight" }

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = "$(train_samples:1000000)" }
accumulator = "latest"

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = "$(havana_bins:128)"
samples_for_update = "$(samples_for_update:50000)"
initial_training_rate = 0.05
final_training_rate = 0.005

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(sample_samples:10000000)" }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
accumulator = "latest"

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"
