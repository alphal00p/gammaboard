# e+ e- -> gamma* -> d d~ at LO, sqrt(s) = 1000 GeV, photon only (epem_a_ddx
# is the photon self-energy supergraph; no Z). GammaLoop half of the comparison;
# physics/results in ./README.md.
#
# Run from the gammaboard repo root:
#   gammaboard run add integrations/madgraph/experiments/gammaloop_vs_madgraph/ee_ddx_gammaloop.toml
#
# Build the artifact (from repo root; gammaloop a sister dir of gammaboard). The
# card already sets e_cm = 1000.0 and integral_unit = "picobarn":
#   ( cd ../gammaloop && ./gammaloop --clean-state \
#       ./examples/cli/epem_a_ddx/LO/epem_a_ddx.toml run generate integrate -c "quit -o" )
#   mkdir -p resources/states/epem_a_ddx/LO
#   cp -r ../gammaloop/examples/cli/epem_a_ddx/LO/state resources/states/epem_a_ddx/LO/state

replacements = { run_name = "ee_ddx_gammaloop", train_samples = 1000000, sample_samples = 10000000, havana_bins = 128, samples_for_update = 50000, max_batch_size = 10000 }

name = '$(run_name:"ee_ddx_gammaloop")'
target = { kind = "vector", components = { real = 3.097e-2, imag = 0.0 } }

[evaluator]
kind = "gammaloop"
state_folder = "states/epem_a_ddx/LO/state"
integrand_name = "LO"

[evaluator.preprocessing]
read_only = true
commands = [
  "set model MT=173.0",
  "set model WT=0.0",
  "set model ymt=173.0",
  "set model aS=0.118",
  "set model aEWM1=132.507",
  "set model Gf=1.166390e-05",
  "set model MZ=91.188",
]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "gammaloop"

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = "$(train_samples:1000000)" }
accumulator = "latest"

[task_queue.sampler_aggregator.config]
kind = "havana_training"
seed = 0
bins = "$(havana_bins:128)"
samples_for_update = "$(samples_for_update:50000)"
initial_training_rate = 0.05
final_training_rate = 0.005

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(sample_samples:10000000)" }
sampler_aggregator = { config = { kind = "havana_inference", source = "latest_training_sampler_aggregator" } }
accumulator = "latest"

[task_queue.queue_tuning]
target_batch_eval_ms = 1000.0
max_batch_size = "$(max_batch_size:10000)"
