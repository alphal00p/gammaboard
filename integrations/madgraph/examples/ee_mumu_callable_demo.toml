# MadGraph7 Python-callable evaluator demo shape.
#
# This config expects a small adapter module at:
#
#   integrations/madgraph/artifacts/ee_mumu/my_mg7_adapter.py
#
# with:
#
#   def matrix_element(momenta, parameters=None):
#       ...
#
# The callable should return one matrix-element value per phase-space point.

replacements = { run_name = "madgraph_ee_mumu_callable_demo", samples = 100000 }

name = '$(run_name:"madgraph_ee_mumu_callable_demo")'
target = { kind = "scalar", value = 0.0 }

[evaluator]
kind = "process_evaluator"
command = ["$resources/../integrations/madgraph/.venv/bin/madgraph-gammaboard-evaluator"]
cwd = "$resources/.."
domain = { continuous = { dims = 2 } }
components = ["value"]

[evaluator.args]
ecm = 91.188
output = ["value"]
phase_space = { kind = "two_body", final_state_masses = [0.0, 0.0], include_flux = true }

[evaluator.args.matrix_element]
kind = "python_callable"
module = "my_mg7_adapter"
function = "matrix_element"
search_path = "integrations/madgraph/artifacts/ee_mumu"

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "scalar"

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(samples:100000)" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 4096 } }
