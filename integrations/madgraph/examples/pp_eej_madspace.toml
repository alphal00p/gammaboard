# MadGraph7 p p -> e+ e- j (Drell-Yan + jet) direct MadSpace demo.
#
# The wrapper uses MG7's generated flat PhaseSpace builder and build_integrands
# helper from madevent.py. This keeps the Python wrapper aligned with the
# current MadSpace API and lets MG7 construct the correct channel/flavour
# bookkeeping internally.
#
# It still uses the flat phase-space mode, not the multichannel/MADNIS path.
#
# Pinned MG7/MadSpace setup. Run from the GammaBoard repository root:
#
#   nix develop
#   git clone https://github.com/MadGraphTeam/MadGraph7.git ../MadGraph7
#   git -C ../MadGraph7 checkout --detach 920d224232b24a3a736443986e2040369929298f
#   python ../MadGraph7/madspace/install.py \
#     --source --no-cuda --no-hip --no-simd --no-debug
#   python -m venv integrations/madgraph/.venv
#   integrations/madgraph/.venv/bin/python -m pip install --upgrade pip
#   integrations/madgraph/.venv/bin/python -m pip install --force-reinstall \
#     integrations/madgraph
#
# One-time PDF set download (if not already present):
#
#   wget https://lhapdfsets.web.cern.ch/lhapdfsets/current/NNPDF23_lo_as_0130_qed.tar.gz -P /tmp/
#   sudo tar -xzf /tmp/NNPDF23_lo_as_0130_qed.tar.gz -C /usr/share/LHAPDF/
#
# One-time state generation. Run from the gammaboard repo root; this assumes the
# Generate the state with the same pinned checkout:
#
#   mkdir -p integrations/madgraph/artifacts/pp_eej
#   python ../MadGraph7/bin/mg5_aMC <<'EOF'
#   import model sm
#   generate p p > e+ e- j
#   output integrations/madgraph/artifacts/pp_eej/mg7_state -f
#   quit
#   EOF
#
# Print the callable random_dim to pass as a replacement before running.
# Run from the gammaboard repo root so the root-relative state_path resolves:
#
#   . integrations/madgraph/.venv/bin/activate
#   python - <<'EOF'
#   from madgraph_gammaboard.state import MadSpaceState
#   s = MadSpaceState.load(
#       state_path="integrations/madgraph/artifacts/pp_eej/mg7_state",
#       madgraph_root="../MadGraph7",
#       subprocess_index=0,
#       flavor_index=0,
#   )
#   print("random_dim =", s.random_dim)
#   print("mapping_random_dim =", s.mapping_random_dim)
#   EOF
#
# Then run with the replacement, for example:
#
#   gammaboard run add integrations/madgraph/examples/pp_eej_madspace.toml \
#     --replace continuous_dims=<random_dim>
#
# For the pinned MG7 revision and pp_eej process, the value is 7.

replacements = { run_name = "madgraph_pp_eej_madspace", samples = 1000000, continuous_dims = 7 }

name = '$(run_name:"madgraph_pp_eej_madspace")'

[evaluator]
kind = "process_evaluator"
command = ["$resources/../integrations/madgraph/.venv/bin/madgraph-gammaboard-evaluator"]
cwd = "$resources/.."
domain = { continuous = { dims = "$(continuous_dims:7)" } }
components = ["weight"]

[evaluator.args]
state_path = "integrations/madgraph/artifacts/pp_eej/mg7_state"
# Resolved relative to cwd (the gammaboard repo root, set above). Assumes the
# This must point to MG7 revision 920d224232b24a3a736443986e2040369929298f,
# with MadSpace built from that checkout as described above.
madgraph_root = "../MadGraph7"
subprocess_index = 0
flavor_index = 0
output = ["weight"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "vector"
components = ["weight"]
training_projection = { kind = "component", name = "weight" }

[[task_queue]]
name = "sample"
kind = "sample"
measurement = { quantity = "central_value" }
stop_condition = { max_samples = "$(samples:100000)" }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 4096 } }
