# Shared CLI/runtime settings used by all commands.
# Keep deploy and server host/auth settings out of this file.
[database]
# Public development credential for the loopback-only managed Postgres.
url = "postgresql://postgres:NqVj2yt5WsCE5nYCOx01MkeFD8n8awoZ@127.0.0.1:5400/gammaboard_db"

[tracing]
persist_runtime_logs = true
db_gammaboard_level = "info"
db_external_level = "warn"

[resources]
roots = ["resources"]

[local_postgres]
data_dir = "db/postgres"
socket_dir = "db/socket"
log_file = "db/logfile"
max_connections = 128
shared_buffers = "256MB"
effective_cache_size = "2GB"
work_mem = "16MB"
checkpoint_timeout = "30min"
max_wal_size = "8GB"
wal_compression = true
synchronous_commit = false
