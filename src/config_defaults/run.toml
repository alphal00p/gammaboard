# Shared defaults merged into every `gammaboard run create <config.toml>` payload.
# `name` is intentionally omitted and must be provided per run.
[evaluator]
kind = "unit"
continuous_dims = 1
discrete_dims = 0

[evaluator_runner_params]
performance_snapshot_interval_ms = 2000
min_tick_time_ms = 10
db_pool_size = 2

[sampler_aggregator_runner_params]
performance_snapshot_interval_ms = 2000
min_tick_time_ms = 10
frontend_sync_interval_ms = 2000
io_threads = 1
db_pool_size = 6

[sampler_aggregator_runner_params.queue]
# Amortize per-batch setup while keeping interactive training responsive.
target_batch_eval_ms = 2000.0
max_batch_size = 100_000
max_batches_per_tick = 100
max_insert_bundle_size = 5
max_concurrent_insert_tasks = 4
completed_batch_fetch_limit = 100
max_batch_retries = 3
