# Symbolica + Havana training, then PDF adaptation plots in 2D and 1D.
# Asymmetric 3D integrand sampled on [0,1]^3:
# f(x,y,z) = 1 + x + 2*y^2 + 3*z^3 + x*y + 2*y*z + 3*x*z^2
# Integral = 25/6.

name = "symbolica-havana-pdf-1d2d"
target = { kind = "scalar", value = 4.166666666666667 }

[evaluator]
kind = "symbolica"
expr = "1 + x + 2*y^2 + 3*z^3 + x*y + 2*y*z + 3*x*z^2"
args = ["x", "y", "z"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "scalar"

[[task_queue]]
name = "havana-train"
kind = "sample"
stop_condition = { max_samples = 200_000 }
sampler_aggregator = { config = { kind = "havana_training", seed = 0, bins = 64, samples_for_update = 16_384, initial_training_rate = 0.1, final_training_rate = 0.001 } }

[[task_queue]]
name = "pdf-2d"
kind = "pdf_adaptation_image"
batch_transforms = []

[task_queue.geometry]
offset = [0.0, 0.0, 0.2]
u_vector = [0.85, 0.1, 0.25]
v_vector = [0.15, 0.75, 0.35]
u_linspace = { start = 0.0, stop = 1.0, count = 128 }
v_linspace = { start = 0.0, stop = 1.0, count = 128 }

[[task_queue]]
name = "pdf-1d"
kind = "pdf_adaptation_plot_line"
batch_transforms = []

[task_queue.geometry]
offset = [0.05, 0.15, 0.2]
direction = [0.9, 0.7, 0.6]
linspace = { start = 0.0, stop = 1.0, count = 512 }
