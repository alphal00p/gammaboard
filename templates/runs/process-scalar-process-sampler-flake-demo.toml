# Process evaluator + process sampler flake demo.
name = "process-scalar-process-sampler-flake-demo"

[evaluator]
kind = "process_scalar"
command = ["nix", "shell", "path:./process_api/examples/python_scalar_sin#runtime", "-c", "gammaboard-example-evaluator-worker"]
continuous_dims = 2
discrete_cardinalities = [2, 3]
args = { module = "demo_integrand", class = "SinIntegrand", scale = 1.0, bias = 0.0, freq_u = 2.0, freq_v = 1.25 }

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"

[task_queue.accumulator]
kind = "scalar"

[task_queue.accumulator.discrete_histograms]
max_total_bins = 16

[[task_queue.accumulator.discrete_histograms.items]]
name = "spin"
hist_dims = [0]
fixed_dims = {}

[[task_queue.accumulator.discrete_histograms.items]]
name = "channel_for_spin_0"
hist_dims = [1]
fixed_dims = { "0" = 0 }

[[task_queue.accumulator.discrete_histograms.items]]
name = "channel_for_spin_1"
hist_dims = [1]
fixed_dims = { "0" = 1 }

[[task_queue]]
name = "sample-a"
kind = "sample"
stop_condition = { max_samples = 1000 }
sampler_aggregator = { config = { kind = "process_sampler", command = ["nix", "shell", "path:./process_api/examples/python_sampler_symbolica_havana#runtime", "-c", "gammaboard-example-sampler-worker"], continuous_dims = 2, requires_training_values = true, args = { module = "demo_sampler", class = "SymbolicaHavanaSampler", seed = 0, bins = 8, samples_for_update = 16, stop_training_after_n_samples = 1000, initial_training_rate = 0.1, final_training_rate = 0.01 } } }
