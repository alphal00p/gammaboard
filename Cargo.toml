[package]
name = "gammaboard"
version = "0.2.0"
edition = "2024"
description = "Distributed numerical integration control plane and dashboard"
license = "MIT"
repository = "https://github.com/alphal00p/gammaboard"
homepage = "https://github.com/alphal00p/gammaboard"
readme = "README.md"
keywords = ["integration", "monte-carlo", "distributed", "scientific"]
categories = ["science", "command-line-utilities"]
include = [
    "/src/**",
    "/migrations/**",
    "/resources/templates/**",
    "/ops/ubelix/resources/templates/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["gammaloop"]
gammaloop = ["dep:gammalooprs", "dep:gammaloop_api"]

[dependencies]
gammalooprs = { git = "https://github.com/alphal00p/gammaloop.git", rev = "4fdbf430b29edd24b9e1292c07ab24a151427dc7", package = "gammalooprs", optional = true }

gammaloop_api = { git = "https://github.com/alphal00p/gammaloop.git", rev = "4fdbf430b29edd24b9e1292c07ab24a151427dc7", package = "gammaloop-api", default-features = false, features = ["cli", "no_pyo3"], optional = true }
tokio = { version = "1.46", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "chrono", "macros"] }
rand = { package = "rand", version = "0.9" }
rand_xoshiro = { version = "0.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
toml = "0.8"
async-trait = "0.1"
thiserror = "2.0"
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main", default-features = false, features = ["gmp", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num = "0.4.3"
tempfile = "3"
anyhow = "1"
comfy-table = "7"
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rpassword = "7"
jsonwebtoken = "9"
url = "2"
egobox-ego = "0.37"
ndarray = "0.16"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[patch.crates-io]
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "main" }

[profile.dev-optim]
inherits = "dev"
opt-level = 2

[lib]
name = "gammaboard"
crate-type = ["rlib"]
