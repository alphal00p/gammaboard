name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      GAMMABOARD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5400/gammaboard_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gammaboard_db
        ports:
          - 5400:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gammaboard_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Run PostgreSQL store integration tests
        run: |
          for migration in migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5400 -U postgres \
              -d gammaboard_db -f "$migration"
          done
          cargo test --locked --test pg_store_integration -- --ignored
          cargo test --locked --test cluster_store -- --ignored --test-threads=2
      - name: Test PostgreSQL dashboard read models
        # These PostgreSQL regressions live in the library, not the integration suites.
        run: |
          cargo test --locked --lib stores::plot_history::tests::compact_history_covers_both_ends_and_resets_after_recovery -- --ignored --exact
          cargo test --locked --lib server::campaign::tests::campaign_views_read_existing_live_and_saved_children_without_new_snapshots -- --ignored --exact
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./process_api/python
      - name: Run backend workflows and seeded recovery invariants
        env:
          GAMMABOARD_TEST_PROFILE: dev
          GAMMABOARD_RECOVERY_SEEDS: "17,41"
        run: scripts/test_e2e.sh core
      - name: Preserve backend recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-evidence
          path: target/e2e
          if-no-files-found: ignore

  rust-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [minimal, symbolica]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./process_api/python
      - name: Check optional backend configuration
        env:
          BUILD_FEATURES: ${{ matrix.features }}
        run: |
          flags=(--locked --no-default-features)
          if [[ "$BUILD_FEATURES" == symbolica ]]; then
            flags+=(--features symbolica)
          else
            dependencies=$(cargo tree "${flags[@]}" --prefix none)
            ! rg '^symbolica v' <<< "$dependencies"
          fi
          python3 scripts/check_cli_docs.py
          cargo clippy "${flags[@]}" --all-targets -- -D warnings
          client_dependencies=$(cargo tree -p gammaboard-client --edges normal --prefix none)
          ! rg '^(gammaboard v|sqlx|symbolica|gammaloop)' <<< "$client_dependencies"
          cargo clippy -p gammaboard-client --all-targets -- -D warnings
          cargo test --workspace "${flags[@]}"
          cargo test "${flags[@]}" --test process_api -- --ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build pytest 'tomli>=2.4,<3'
      - run: python -m build process_api/python
      - name: Install process wheel into a clean environment
        run: |
          python -m venv /tmp/gammaboard-process-wheel
          /tmp/gammaboard-process-wheel/bin/pip install process_api/python/dist/*.whl
          /tmp/gammaboard-process-wheel/bin/python -c 'from gammaboard_process import Batch, Domain, Feedback, GenerationStatus, ObservableBatch; from gammaboard_process.protocol import PROTOCOL; assert PROTOCOL == "gammaboard-jsonrpc-v10"'
      - run: python -m pip install process_api/python/dist/*.whl
      - run: python -m pip check
      - run: python -m pytest -q process_api/python/tests
      - name: Test repository startup wrapper
        run: python -m unittest discover -s tools/tests
      - name: Test benchmark measurement and lifecycle contracts
        run: python -m unittest discover -s benchmarks/tests
      - name: Reject retired CLI and protocol spellings
        run: |
          ! rg -n '(run add|run task add|node auto-run|deploy run|gammaboard-jsonrpc-v1\b)' \
            README.md docs integrations ops resources process_api justfile
      - name: Validate tracked TOML
        run: |
          python - <<'PY'
          import subprocess
          # Python 3.13's tomllib only supports TOML 1.0.
          import tomli

          paths = subprocess.check_output(
              ["git", "ls-files", "*.toml"], text=True
          ).splitlines()
          for path in paths:
              with open(path, "rb") as handle:
                  tomli.load(handle)
          PY

  ubelix:
    # setup-python has the minimum supported Python 3.11.8 on 24.04, not 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q ops/slurm/tests
      - name: Validate UBELIX Python and shell entry points
        run: |
          python -m py_compile ops/slurm/slurm.py
          for script in ops/slurm/build/*.sh ops/slurm/build/*.sbatch ops/slurm/slurm/*.sbatch; do
            bash -n "$script"
          done
