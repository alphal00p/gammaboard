name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SYMBOLICA_OEM_LICENSE: SYMBOLICA_OEM_GAMMALOOP

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      GAMMABOARD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5400/gammaboard_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gammaboard_db
        ports:
          - 5400:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gammaboard_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo check --locked --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Test migration upgrade from the previous schema
        run: |
          createdb -h 127.0.0.1 -p 5400 -U postgres gammaboard_upgrade_test
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5400 -U postgres \
            -d gammaboard_upgrade_test -f migrations/202608180001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5400 -U postgres \
            -d gammaboard_upgrade_test -f tests/migration_upgrade.sql
          dropdb -h 127.0.0.1 -p 5400 -U postgres gammaboard_upgrade_test
      - name: Run PostgreSQL store integration tests
        run: |
          for migration in migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5400 -U postgres \
              -d gammaboard_db -f "$migration"
          done
          cargo test --locked --test pg_store_integration -- --ignored
      - name: Run authenticated API integration test
        run: cargo test --locked --test full_stack_cli full_stack_server_auth_protects_pause_endpoint -- --ignored
      - name: Run installation smoke integration test
        run: cargo test --locked --test full_stack_cli full_stack_cli_installation_smoke_produces_unit_estimate -- --ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade build pytest
      - run: python -m build process_api/python
      - name: Install process wheel into a clean environment
        run: |
          python -m venv /tmp/gammaboard-process-wheel
          /tmp/gammaboard-process-wheel/bin/pip install process_api/python/dist/*.whl
          /tmp/gammaboard-process-wheel/bin/python -c 'import gammaboard_process'
      - run: python -m pip install process_api/python/dist/*.whl
      - run: python -m pip install --no-deps -e integrations/madgraph
      - run: python -m pytest -q process_api/python/tests integrations/madgraph/tests
      - name: Test queue benchmark script
        run: python -m unittest discover -s scripts -p test_benchmark_queue.py
      - name: Reject retired CLI and protocol spellings
        run: |
          ! rg -n '(run add|run task add|node auto-run|deploy run|gammaboard-jsonrpc-v1)' \
            README.md docs integrations ops resources process_api justfile
      - name: Validate tracked TOML
        run: |
          python - <<'PY'
          import subprocess
          import tomllib

          paths = subprocess.check_output(
              ["git", "ls-files", "*.toml"], text=True
          ).splitlines()
          for path in paths:
              with open(path, "rb") as handle:
                  tomllib.load(handle)
          PY

  ubelix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q ops/ubelix/tests
      - name: Validate UBELIX Python and shell entry points
        run: |
          python -m py_compile ops/ubelix/ubelix.py
          bash -n ops/ubelix/build/common.sh
          bash -n ops/ubelix/build/build.sbatch
          bash -n ops/ubelix/build/gammaboard.sbatch
          bash -n ops/ubelix/build/gammaloop.sbatch
          bash -n ops/ubelix/slurm/control.sbatch
          bash -n ops/ubelix/slurm/smoke.sbatch
          bash -n ops/ubelix/slurm/worker.sbatch
          bash -n ops/ubelix/sync_ops.sh
