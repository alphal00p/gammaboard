# Backend API/dashboard and deploy settings for the ITPhlies profile.
name = "itphlies"
api_host = "127.0.0.1"
api_port = 4000
allowed_origins = [
    "http://localhost:8080",
    "http://itphlies:8080",
    "http://itphlies.tailb3264.ts.net:8080",
]
secure_cookie = false
allow_local_node_spawn = true

[frontend]
build_dir = "../../../dashboard/build"
host = "0.0.0.0"
port = 8080
advertise_hosts = ["localhost", "itphlies"]

[database]
ensure_started = true

# Omit [auth] for the trusted-network fast path. To enable authentication,
# put a private server config outside this repository with a generated password
# hash and a high-entropy session secret.
