[database]
url = "postgresql://postgres:postgres@127.0.0.1:${DB_PORT}/gammaboard_db"

[tracing]
persist_runtime_logs = true
db_gammaboard_level = "info"
db_external_level = "warn"

[local_postgres]
# Persistent state: survives walltime/preemption and lets runs resume.
data_dir = "${WORKSPACE_ROOT}/db/${DEPLOY_NAME}/data"

# Workspace socket dir for environments where node-local scratch is read-only.
socket_dir = "${WORKSPACE_ROOT}/db/${DEPLOY_NAME}/socket"

# Persist logs for post-mortem debugging.
log_file = "${WORKSPACE_ROOT}/logs/control/postgres-${DEPLOY_NAME}.log"

max_connections = 128
shared_buffers = "1GB"
effective_cache_size = "4GB"
work_mem = "16MB"
checkpoint_timeout = "30min"
max_wal_size = "4GB"
wal_compression = true
synchronous_commit = true
