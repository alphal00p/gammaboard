# Private config/cluster.toml overrides these managed Slurm profiles.
# Choose account/partition/qos/time values permitted by your UBELIX allocation.
[control]
account = "gratis"
partition = "epyc2"
qos = "job_gratis"
time = "01:00:00"
cpus_per_task = 2
mem = "4G"

[worker]
account = "gratis"
partition = "epyc2"
qos = "job_gratis"
time = "00:30:00"
cpus_per_task = 1
mem = "2G"

[build]
account = "gratis"
partition = "epyc2"
time = "02:00:00"
cpus_per_task = 6
mem = "16G"
