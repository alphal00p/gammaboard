# [cluster.*] in local.toml overrides these Slurm profiles.
# Choose account/partition/qos/time values permitted by your UBELIX allocation.
# Allocation rationale and free-tier arithmetic are documented in README.md.
[control]
account = "gratis"
partition = "epyc2"
qos = "job_gratis"
time = "01:00:00"
cpus_per_task = 2
mem = "4G"

[worker]
account = "gratis"
partition = "epyc2"
qos = "job_gratis"
time = "01:00:00"
cpus_per_task = 2
mem = "8G"

[build]
account = "gratis"
partition = "epyc2"
qos = "job_gratis"
time = "02:00:00"
cpus_per_task = 32
mem = "128G"
