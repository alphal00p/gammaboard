# Foreground single-node deploy orchestration for UBELIX.
[api_server]
api_server_config = "server-single-node.toml"

[static_site]
frontend_build_dir = "/usr/local/share/gammaboard/dashboard"

[frontend_http]
frontend_host = "0.0.0.0"
frontend_port = 8080
frontend_server_name = "_"
frontend_advertise_hosts = ["localhost"]
access_log = false

[database]
ensure_started = true

[cleanup]
sampler_drain_timeout_seconds = 60
node_stop_timeout_seconds = 15
poll_interval_ms = 250
