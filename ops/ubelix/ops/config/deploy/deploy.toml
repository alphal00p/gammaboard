# Foreground deploy orchestration for UBELIX control jobs.
[api_server]
api_server_config = "../server/server.toml"

[static_site]
frontend_build_dir = "../../../artifacts/dashboard-build"

[frontend_http]
frontend_host = "0.0.0.0"
frontend_port = 8080
frontend_server_name = "_"
frontend_advertise_hosts = ["localhost"]

[database]
ensure_started = true

[cleanup]
pause_runs = true
stop_nodes = true
