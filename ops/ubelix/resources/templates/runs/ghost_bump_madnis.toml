# Ghost bump with the MADNIS process sampler runtime deployed under resources/runtimes.

name = "ghost_bump_madnis"
sampler_requirements = { gpu = 1 }

[evaluator]
kind = "symbolica"
expr = "1/((x-1/4)^2+(y-1/4)^2+1/20) + 1/((x-3/4)^2+(y-3/4)^2+1/20) - 1/2"
args = ["x", "y"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "scalar"

[[task_queue]]
name = "madnis-train"
kind = "sample"

[task_queue.stop_condition]
max_samples = 200000

[task_queue.sampler_aggregator.config]
kind = "process_sampler"
command = ["apptainer", "exec", "--no-mount", "/etc/localtime", "--nv", "runtimes/madnis_gammaboard_api/runtime.sif", "python", "-u", "/opt/madnis_gammaboard_api/sampler_worker.py"]
# Alternative with the Nix runtime when Nix is available:
# command = ["runtimes/madnis_gammaboard_api/result/bin/python", "-u", "runtimes/madnis_gammaboard_api/sampler_worker.py"]
requires_training_values = true

[task_queue.sampler_aggregator.config.args]
module = "madnis_sampler"
class = "MadnisSampler"
seed = 0
training_samples = 200000
save_path = "runtimes/madnis_gammaboard_api/checkpoints/ghost_bump_madnis"

[[task_queue]]
name = "pdf-2d"
kind = "pdf_adaptation_image"

[task_queue.geometry]
offset = [0.0, 0.0]
u_vector = [1.0, 0.0]
v_vector = [0.0, 1.0]

[task_queue.geometry.u_linspace]
start = 0.0
stop = 1.0
count = 128

[task_queue.geometry.v_linspace]
start = 0.0
stop = 1.0
count = 128
