# Ghost bump with the MADNIS process sampler runtime deployed under resources/madnis.
#
# Required artifacts/tools:
# - Apptainer with GPU support must be installed on the worker host.
# - `$resources/madnis/madnis.sif` must exist.
# - The `madnis/checkpoints` directory must be writable.

replacements = { run_name = "ghost_bump_madnis", train_samples = 200000, training_steps = 200, training_batch_size = 1000, madnis_dir = "madnis", save_path = "madnis/checkpoints/ghost_bump_madnis", image_bins = 128 }

name = '$(run_name:"ghost_bump_madnis")'
sampler_requirements = { gpu = 1 }

[evaluator]
kind = "symbolica"
expr = "1/((x-1/4)^2+(y-1/4)^2+1/20) + 1/((x-3/4)^2+(y-3/4)^2+1/20) - 1/2"
args = ["x", "y"]

[[task_queue]]
name = "accumulator"
kind = "set_accumulator"
accumulator = "scalar"

[[task_queue]]
name = "madnis-train"
kind = "sample"

[task_queue.stop_condition]
max_samples = "$(train_samples:200000)"

[task_queue.sampler_aggregator.config]
kind = "process_sampler"
command = ["/usr/bin/apptainer", "exec", "--no-mount", "/etc/localtime", "--nv", "--bind", "$resources:$resources", "$resources/$(madnis_dir:\"madnis\")/madnis.sif", "madnis-gammaboard-sampler"]
cwd = "$resources"
# Alternative with the Nix runtime when Nix is available:
# command = ["$resources/processes/madnis_gammaboard_api/result/bin/python", "-u", "-m", "run_sampler"]
requires_training_values = true

[task_queue.sampler_aggregator.config.args]
seed = 0
training_steps = "$(training_steps:200)"
training_batch_size = "$(training_batch_size:1000)"
save_path = '$(save_path:"madnis/checkpoints/ghost_bump_madnis")'

[[task_queue]]
name = "pdf-2d"
kind = "pdf_adaptation_image"
sampler_aggregator = { from_name = "madnis-train" }

[task_queue.geometry]
offset = [0.0, 0.0]
u_vector = [1.0, 0.0]
v_vector = [0.0, 1.0]

[task_queue.geometry.u_linspace]
start = 0.0
stop = 1.0
count = "$(image_bins:128)"

[task_queue.geometry.v_linspace]
start = 0.0
stop = 1.0
count = "$(image_bins:128)"
