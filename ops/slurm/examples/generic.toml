# Copy alongside your instance file and edit every site-dependent value.
instance_file = "gammaboard.toml"
workspace_root = "."
image = "images/gammaboard.sif"
job_env_file = "environment.sh"
binds = ["."]

[control]
account = "YOUR_ACCOUNT"
partition = "YOUR_PARTITION"
cpus_per_task = 4
mem = "8G"
time = "02:00:00"

[worker]
account = "YOUR_ACCOUNT"
partition = "YOUR_PARTITION"
cpus_per_task = 2
mem = "8G"
time = "01:00:00"

[build]
account = "YOUR_ACCOUNT"
partition = "YOUR_PARTITION"
cpus_per_task = 32
mem = "128G"
time = "02:00:00"

[access]
ssh_host = "login.YOUR_CLUSTER" # Login username is inferred; ssh_target overrides both.
local_port = 8080
