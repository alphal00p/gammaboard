name = "cluster-demo"
externally_managed = true

[paths]
state_dir = "control"
log_dir = "logs"
temp_dir = "tmp"
template_dir = "resources/templates"
resource_roots = ["resources"]

[database]
mode = "managed"
host = "127.0.0.1"
port = 5400
name = "gammaboard"
user = "postgres"
data_dir = "resources/db/postgres"
socket_dir = "resources/db/socket"

[database.tuning]
listen_addresses = "0.0.0.0"

[server]
# Trust loopback browser pages on any forwarded port; set false for exact-only access.
allow_loopback_origins = true
host = "0.0.0.0"
api_port = 4000
dashboard_dir = "/usr/local/share/gammaboard/dashboard"

[shutdown]
sampler_drain_timeout_seconds = 60
node_stop_timeout_seconds = 15
