name = "cluster-demo"
externally_managed = true

[paths]
state_dir = "/shared/YOUR_USER/gammaboard/control"
log_dir = "/shared/YOUR_USER/gammaboard/logs"
temp_dir = "/shared/YOUR_USER/gammaboard/tmp"
template_dir = "/shared/YOUR_USER/gammaboard/resources/templates"
resource_roots = ["/shared/YOUR_USER/gammaboard/resources"]

[database]
mode = "managed"
host = "127.0.0.1"
port = 5400
name = "gammaboard"
user = "postgres"
data_dir = "/shared/YOUR_USER/gammaboard/resources/db/postgres"
socket_dir = "/shared/YOUR_USER/gammaboard/resources/db/socket"

[database.tuning]
listen_addresses = "0.0.0.0"

[server]
host = "0.0.0.0"
api_port = 4000
dashboard_dir = "/usr/local/share/gammaboard/dashboard"

[shutdown]
sampler_drain_timeout_seconds = 60
node_stop_timeout_seconds = 15
